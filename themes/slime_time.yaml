  ha-font-family-body: Nunito, system-ui, sans-serif
  ha-font-family-heading: '"Luckiest Guy", Nunito, system-ui, sans-serif'
  ha-font-weight-medium: '800'
  ha-font-weight-bold: '900'
  card-mod-theme: Slime Time
  card-mod-card-yaml: ".: |\n  @keyframes slime-boing {\n    0%, 100% { transform:\
    \ translateY(0) scale(1, 1); }\n    30% { transform: translateY(-4px) scale(.92,\
    \ 1.08); }\n    55% { transform: translateY(0) scale(1.08, .92); }\n    75% {\
    \ transform: translateY(-1px) scale(1, 1); }\n  }\n  ha-card {\n    transition:\
    \ background 0.25s ease;\n  }\n  ha-card.active {\n    background: var(--slime-on-bg)\
    \ !important;\n    --tile-color: var(--slime-on-icon) !important;\n    color:\
    \ var(--slime-tile-text);\n  }\n  ha-tile-icon {\n    --tile-icon-border-radius:\
    \ 50%;\n    --tile-icon-opacity: 1;\n    --tile-icon-hover-opacity: 1;\n    --tile-icon-color:\
    \ var(--slime-bubble-bg);\n    --tile-icon-size: 26px;\n    color: var(--slime-icon);\n\
    \  }\n  ha-card.active ha-tile-icon {\n    --tile-icon-color: var(--slime-bubble-bg);\n\
    \    color: var(--slime-on-icon);\n    animation: slime-boing 1.3s ease-in-out\
    \ infinite;\n    transform-origin: 50% 100%;\n  }\n  @media (prefers-reduced-motion:\
    \ reduce) { ha-tile-icon { animation: none !important; } }\nha-tile-icon$: |\n\
    \  .container {\n    border: 3px solid var(--slime-ink);\n    box-sizing: border-box;\n\
    \    box-shadow: 2px 2px 0 var(--slime-ink);\n  }\nha-tile-info$: |\n  .primary\
    \ {\n    font-weight: 900;\n    color: var(--slime-tile-text);\n  }\n  .secondary\
    \ {\n    font-family: \"Luckiest Guy\", Nunito, sans-serif;\n    font-size: 15px;\n\
    \    letter-spacing: 0.5px;\n    color: var(--slime-tile-text);\n    opacity:\
    \ 0.9;\n  }\n"

