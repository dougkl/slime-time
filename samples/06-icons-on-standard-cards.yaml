# Sample: just the cartoon icon pack on Home Assistant's own cards (no button-card needed).
# Any card or entity that takes an icon accepts slime:<name>, e.g. slime:bulb, slime:sofa, slime:fridge.
# Full list: see the README or images/icons.png.

type: grid
columns: 2
square: false
cards:
- type: tile
  entity: light.living_room
  icon: slime:bulb
  features:
  - type: light-brightness
- type: tile
  entity: switch.coffee_maker
  icon: slime:plug
- type: tile
  entity: lock.front_door
  icon: slime:lock
- type: tile
  entity: media_player.living_room_tv
  icon: slime:tv
